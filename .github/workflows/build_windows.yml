name: Build Windows Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run verification tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases/RAW_Manager_Windows_x64
          Copy-Item -Recurse -Force build/windows/x64/runner/Release/* releases/RAW_Manager_Windows_x64/
          Copy-Item assets/guida_raw_manager.md releases/RAW_Manager_Windows_x64/GUIDA_UTENTE.md
          Compress-Archive -Path releases/RAW_Manager_Windows_x64/* -DestinationPath releases/RAW_Manager_Windows_x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAW_Manager_Windows_x64
          path: releases/RAW_Manager_Windows_x64.zip
