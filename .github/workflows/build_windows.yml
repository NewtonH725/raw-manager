name: Build Windows Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pillow

      - name: Generate synthetic test dataset
        run: python execution/generate_test_rafs.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run verification tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases/RAW_Manager_Windows_x64
          Copy-Item -Recurse -Force build/windows/x64/runner/Release/* releases/RAW_Manager_Windows_x64/
          Copy-Item assets/guida_raw_manager.md releases/RAW_Manager_Windows_x64/GUIDA_UTENTE.md
          Compress-Archive -Path releases/RAW_Manager_Windows_x64/* -DestinationPath releases/RAW_Manager_Windows_x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAW_Manager_Windows_x64
          path: releases/RAW_Manager_Windows_x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "RAW Manager v1.0.0 (Windows x64)"
          body: |
            ## RAW Manager v1.0.0
            Release ufficiale per Windows a 64-bit.
            
            ### Istruzioni per Windows:
            1. Scarica ed estrai **`RAW_Manager_Windows_x64.zip`**.
            2. Avvia **`raw_manager.exe`** per eseguire subito l'applicazione.
          files: |
            releases/RAW_Manager_Windows_x64.zip
