name: Build Windows Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable & Setup Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract App Version from pubspec.yaml
        id: app_version
        shell: pwsh
        run: |
          $line = (Get-Content pubspec.yaml | Select-String -Pattern '^version:\s*([^\s+]+)').Matches[0].Groups[1].Value
          echo "version=$line" >> $env:GITHUB_OUTPUT
          echo "tag=v$line" >> $env:GITHUB_OUTPUT
          Write-Host "Versione rilevata: $line (Tag: v$line)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pillow

      - name: Generate synthetic test dataset
        run: python execution/generate_test_rafs.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run verification tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Portable Bundle
        shell: pwsh
        run: |
          $ver = "${{ steps.app_version.outputs.version }}"
          $dir = "releases/RAW_Manager_v${ver}_Windows_x64_Portable"
          $zip = "releases/RAW_Manager_v${ver}_Windows_x64_Portable.zip"
          New-Item -ItemType Directory -Force -Path $dir
          Copy-Item -Recurse -Force build/windows/x64/runner/Release/* $dir/
          Copy-Item assets/guida_raw_manager.md "$dir/GUIDA_UTENTE.md"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer (Setup.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Compilazione Setup con Inno Setup: $iscc"
          & $iscc "/DMyAppVersion=${{ steps.app_version.outputs.version }}" windows/inno_setup.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RAW_Manager_v${{ steps.app_version.outputs.version }}_Windows_x64
          path: |
            releases/RAW_Manager_v${{ steps.app_version.outputs.version }}_Windows_x64_Setup.exe
            releases/RAW_Manager_v${{ steps.app_version.outputs.version }}_Windows_x64_Portable.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: "RAW Manager ${{ steps.app_version.outputs.tag }} (Windows, Linux, Android)"
          body: |
            ## RAW Manager ${{ steps.app_version.outputs.tag }}

            ### Novità di questa versione:
            - **UI Adaptive Tablet vs Smartphone:** Layout dedicato e compatto su smartphone (Pixel 9 Pro XL) e layout esteso su tablet/desktop (Galaxy Tab S10 Ultra).
            - **Testi centrati e SafeArea:** Correzione allineamento iniziale e barra inferiore protetta dalla barra gesti Android.
            - **Supporto potenziato Ricoh GR IIIx DNG:** Estrazione di anteprime ad alta risoluzione e filtro contro stream Lossless non JPEG.
            - **Nomi pacchetti con numero di versione:** Tutti i file scaricabili includono esplicitamente la versione della build.

            ### Pacchetti disponibili:
            - **Windows (Installabile):** `RAW_Manager_v${{ steps.app_version.outputs.version }}_Windows_x64_Setup.exe`
            - **Windows (Portable):** `RAW_Manager_v${{ steps.app_version.outputs.version }}_Windows_x64_Portable.zip`
            - **Android:** `RAW_Manager_v${{ steps.app_version.outputs.version }}_Android_arm64.apk`
            - **Linux:** `RAW_Manager_v${{ steps.app_version.outputs.version }}_Ubuntu_x64_Bundle.tar.gz`
          files: |
            releases/RAW_Manager_v${{ steps.app_version.outputs.version }}_Windows_x64_Setup.exe
            releases/RAW_Manager_v${{ steps.app_version.outputs.version }}_Windows_x64_Portable.zip
            docs/RAW_Manager_Guida_Ufficiale.pdf
