name: Build Windows Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable & Setup Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract App Version from pubspec.yaml
        id: app_version
        shell: pwsh
        run: |
          $line = (Get-Content pubspec.yaml | Select-String -Pattern '^version:\s*([^\s+]+)').Matches[0].Groups[1].Value
          echo "version=$line" >> $env:GITHUB_OUTPUT
          echo "tag=v$line" >> $env:GITHUB_OUTPUT
          Write-Host "Versione rilevata: $line (Tag: v$line)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pillow

      - name: Generate synthetic test dataset
        run: python execution/generate_test_rafs.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run verification tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Portable Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases/RAW_Manager_Windows_x64_Portable
          Copy-Item -Recurse -Force build/windows/x64/runner/Release/* releases/RAW_Manager_Windows_x64_Portable/
          Copy-Item assets/guida_raw_manager.md releases/RAW_Manager_Windows_x64_Portable/GUIDA_UTENTE.md
          Compress-Archive -Path releases/RAW_Manager_Windows_x64_Portable/* -DestinationPath releases/RAW_Manager_Windows_x64_Portable.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer (Setup.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Compilazione Setup con Inno Setup: $iscc"
          & $iscc "/DMyAppVersion=${{ steps.app_version.outputs.version }}" windows/inno_setup.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RAW_Manager_Windows_x64
          path: |
            releases/RAW_Manager_Windows_x64_Setup.exe
            releases/RAW_Manager_Windows_x64_Portable.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: "RAW Manager ${{ steps.app_version.outputs.tag }} (Windows, Linux, Android)"
          body: |
            ## RAW Manager ${{ steps.app_version.outputs.tag }}

            ### Novità di questa versione:
            - **Auto-Updater Integrato:** Controllo automatico delle nuove release su GitHub all'avvio dell'app con pop-up Material 3 e download diretto in-app.
            - **Icona Centrata con Precisione Sub-Pixel:** Petali del diaframma perfettamente centrati su Android Adaptive Icons, Linux e Windows.
            - **Barra Superiore Fissa & Swipe Touch:** Nessuna sovrapposizione alle immagini e scorrimento touch laterale fluido.

            ### Pacchetti disponibili:
            - **Windows (Installabile):** Scarica ed esegui **`RAW_Manager_Windows_x64_Setup.exe`**
            - **Windows (Portable):** Scarica ed estrai **`RAW_Manager_Windows_x64_Portable.zip`**
            - **Android:** Scarica e installa **`RAW_Manager_Android_arm64.apk`**
            - **Linux:** Scarica **`RAW_Manager_Ubuntu_x64_Bundle.tar.gz`**
          files: |
            releases/RAW_Manager_Windows_x64_Setup.exe
            releases/RAW_Manager_Windows_x64_Portable.zip
            docs/RAW_Manager_Guida_Ufficiale.pdf
