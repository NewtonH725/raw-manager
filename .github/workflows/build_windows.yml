name: Build Windows Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable & Setup Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pillow

      - name: Generate synthetic test dataset
        run: python execution/generate_test_rafs.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run verification tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Portable Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases/RAW_Manager_Windows_x64_Portable
          Copy-Item -Recurse -Force build/windows/x64/runner/Release/* releases/RAW_Manager_Windows_x64_Portable/
          Copy-Item assets/guida_raw_manager.md releases/RAW_Manager_Windows_x64_Portable/GUIDA_UTENTE.md
          Compress-Archive -Path releases/RAW_Manager_Windows_x64_Portable/* -DestinationPath releases/RAW_Manager_Windows_x64_Portable.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer (Setup.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Compilazione Setup con Inno Setup: $iscc"
          & $iscc windows/inno_setup.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RAW_Manager_Windows_x64
          path: |
            releases/RAW_Manager_Windows_x64_Setup.exe
            releases/RAW_Manager_Windows_x64_Portable.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "RAW Manager v1.0.0 (Windows x64 - Setup & Portable)"
          body: |
            ## RAW Manager v1.0.0 (Windows a 64-bit)
            
            Scegli la versione che preferisci:
            
            ### 1. Versione Installabile (Setup guidato con icona e menù Start)
            - Scarica ed esegui **`RAW_Manager_Windows_x64_Setup.exe`**.
            - Installa il programma in `Program Files`, crea automaticamente l'icona sul Desktop e nel Menù Start di Windows e include il disinstallatore pulito.
            
            ### 2. Versione Portable (senza installazione)
            - Scarica ed estrai **`RAW_Manager_Windows_x64_Portable.zip`**.
            - Apri la cartella estratta e fai doppio clic su **`raw_manager.exe`** per usarlo direttamente anche da chiavetta USB.
          files: |
            releases/RAW_Manager_Windows_x64_Setup.exe
            releases/RAW_Manager_Windows_x64_Portable.zip
